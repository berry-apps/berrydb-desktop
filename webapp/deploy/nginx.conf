# ==============================================================================
# Nginx Configuration for BerryDB WebApp (db.berryhub.app)
# ==============================================================================

# ── 1. HTTP → HTTPS Redirect (Port 80) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name db.berryhub.app www.db.berryhub.app;

    return 301 https://db.berryhub.app$request_uri;
}

# ── 2. HTTPS www → non-www Redirect (Port 443) ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.db.berryhub.app;

    ssl_certificate     /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    return 301 https://db.berryhub.app$request_uri;
}

# ── 3. Main HTTPS Production Server for db.berryhub.app ─────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name db.berryhub.app;

    # Root pointing to atomic deployment symlink (or webapp dir)
    root /var/www/berrydb/current;
    index index.html docs.html;

    # SSL Configuration (Cloudflare Origin CA)
    ssl_certificate     /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # HTML Routing & Direct Documentation Access
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /docs {
        try_files /docs.html =404;
    }

    # Version API Endpoint (auto-updater & web client polling)
    location = /version.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /version.json /public/version.json =404;
    }

    # Sparkle Appcast Feed Endpoint
    location = /appcast.xml {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/xml; charset=utf-8" always;
        try_files /appcast.xml /deploy/appcast.xml =404;
    }

    # Static Assets & Images Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
