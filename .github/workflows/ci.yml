name: CI

on:
  push:
    branches:
      - main
    paths:
      - "App/**"
      - "MCP/**"
      - "Packages/**"
      - "Tests/**"
      - "Package.resolved"
      - "Package.swift"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "App/**"
      - "MCP/**"
      - "Packages/**"
      - "Tests/**"
      - "Package.resolved"
      - "Package.swift"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "scripts/check-comment-hygiene.sh"
      - "scripts/test-check-comment-hygiene.sh"
      - "scripts/check-size.sh"
      - "scripts/test-check-size.sh"
      - "scripts/check-minos.sh"
      - "scripts/test-check-minos.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The comment-hygiene check diffs against the merge base with the
          # target branch, which a depth-1 checkout does not contain.
          fetch-depth: 0

      - name: Comment hygiene (lines added by this pull request)
        if: github.event_name == 'pull_request'
        run: |
          scripts/test-check-comment-hygiene.sh
          scripts/check-comment-hygiene.sh "origin/${{ github.base_ref }}"

      - name: Bundle guard script tests
        # The release workflow relies on these guards; their tests build tiny
        # Mach-O fixtures with clang and need no FreeTDS or signing identity.
        run: |
          scripts/test-check-size.sh
          scripts/test-check-minos.sh

      - name: Install FreeTDS dependency
        run: |
          brew install freetds

      - name: Check Swift toolchain
        run: |
          swift --version

      - name: Setup CI Keychain
        run: |
          security create-keychain -p "" ci.keychain 2>/dev/null || true
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p "" ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')

      - name: Build BerryDB
        run: |
          swift build -c debug

      - name: Run Test Suite
        # A test process whose output stops for three minutes is sampled
        # (every thread's stack, printed) and the step fails, so a hang names
        # its cause instead of ending silently at the job timeout.
        shell: bash
        run: |
          : > test-output.log
          ( set +e; swift test 2>&1 | tee test-output.log; echo "${PIPESTATUS[0]}" > test-exit-code ) &
          last=-1
          quiet=0
          while [ ! -f test-exit-code ]; do
            sleep 20
            lines=$(wc -l < test-output.log)
            if [ "$lines" = "$last" ]; then quiet=$((quiet + 1)); else quiet=0; fi
            last=$lines
            if [ "$quiet" -ge 9 ]; then
              echo "::error::No test output for three minutes; sampling the test process."
              for pid in $(pgrep -f 'BerryDBPackageTests.xctest/Contents/MacOS/BerryDBPackageTests'); do
                sample "$pid" 5 -file "sample-$pid.txt" > /dev/null 2>&1
                cat "sample-$pid.txt"
              done
              exit 1
            fi
          done
          exit "$(cat test-exit-code)"
