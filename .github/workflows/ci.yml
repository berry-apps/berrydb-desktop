name: CI

on:
  push:
    branches:
      - main
    paths:
      - "App/**"
      - "Packages/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "App/**"
      - "Packages/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FreeTDS dependency
        run: |
          brew install freetds

      - name: Check Swift toolchain
        run: |
          swift --version

      - name: Setup CI Keychain
        run: |
          security create-keychain -p "" ci.keychain 2>/dev/null || true
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p "" ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')

      - name: Build BerryDB
        run: |
          swift build -c debug

      - name: Run Test Suite
        run: |
          swift test
