name: Deploy BerryDB WebApp

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - "deploy/last-release.json"
      - "deploy/releases.json"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:
    inputs:
      force_version:
        description: "Force specific version (leave empty for auto-detect from deploy/last-release.json)"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 1.0.3)"
        required: true
        type: string

concurrency:
  group: berrydb-webapp-deploy
  cancel-in-progress: false

env:
  APP_NAME: berrydb-webapp
  DEPLOY_PATH: /var/www/berrydb
  DOMAIN: db.berryhub.app

jobs:
  deploy:
    name: "Build, Sync Version & Deploy WebApp"
    if: github.repository == 'berry-apps/berrydb-desktop'
    runs-on: [self-hosted, berrydb]
    timeout-minutes: 10

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4
        with:
          clean: true

      - name: "Reset sparse checkout"
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git read-tree --reset -u HEAD 2>/dev/null || git checkout HEAD -- . 2>/dev/null || true

      - name: "Extract & Sync Version"
        id: version_step
        run: |
          # Only what this workflow actually knows. When nothing was passed --
          # a push that touched webapp/ -- leave it empty and let deploy.sh
          # decide, because it can see what is currently live and this cannot.
          # The hardcoded "1.0.2" that used to sit here was not a default: it was
          # a wrong answer given confidently, and deploy.sh carried the same one.
          VERSION="${{ inputs.version || github.event.inputs.force_version }}"
          if [ -n "$VERSION" ]; then
            echo "Version supplied by the caller: v$VERSION"
          else
            echo "No version supplied; deploy.sh will keep whatever is live"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # No files written here. webapp/deploy/deploy.sh generates version.json
          # and syncs the HTML, and it runs after this step -- when both wrote the
          # file, deploy.sh won and published its own stale constant while this
          # step had the right number. One generator, one answer.
          echo "✅ Version resolved: v$VERSION"

      - name: "Deploy Nginx Configuration"
        run: |
          CONF_SRC="webapp/deploy/nginx.conf"
          CONF_DST="/etc/nginx/sites-available/db.berryhub.app"
          CONF_LINK="/etc/nginx/sites-enabled/db.berryhub.app"

          if [ -f "$CONF_SRC" ]; then
            echo "Deploying Nginx config from $CONF_SRC to $CONF_DST..."
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo cp "$CONF_SRC" "$CONF_DST"

            if [ ! -L "$CONF_LINK" ]; then
              sudo ln -sf "$CONF_DST" "$CONF_LINK"
              echo "Created symlink $CONF_LINK"
            fi

            # Test Nginx
            sudo nginx -t
            echo "✅ Nginx configuration syntax is valid."
          fi

      - name: "Test version resolution"
        run: bash webapp/deploy/test-deploy-version.sh

      - name: "Deploy WebApp to Production Slot"
        run: |
          chmod +x webapp/deploy/deploy.sh
          BERRYDB_VERSION="${{ steps.version_step.outputs.version }}" bash webapp/deploy/deploy.sh

      - name: "Verify Deployment & Health Check"
        run: |
          CURRENT_SLOT=$(readlink "${{ env.DEPLOY_PATH }}/current" || echo "unknown")
          echo "Active Production Target: $CURRENT_SLOT"

          test -f "${{ env.DEPLOY_PATH }}/current/index.html" || { echo "❌ index.html is missing!"; exit 1; }
          test -f "${{ env.DEPLOY_PATH }}/current/docs.html" || { echo "❌ docs.html is missing!"; exit 1; }
          test -f "${{ env.DEPLOY_PATH }}/current/version.json" || { echo "❌ version.json is missing!"; exit 1; }

          echo "🎉 Deployment successfully verified!"
          echo "🌍 Production URL: https://${{ env.DOMAIN }}"
          echo "📖 Documentation: https://${{ env.DOMAIN }}/docs"
          echo "📦 Version Endpoint: https://${{ env.DOMAIN }}/version.json"

      - name: "Cleanup workspace"
        if: always()
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -name ".git" -prune -o -exec rm -rf {} + 2>/dev/null || true
