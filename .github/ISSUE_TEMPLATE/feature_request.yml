name: "✨ Feature Request"
description: "Suggest an idea or improvement for BerryDB"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please explain the problem you are trying to solve and how you envision BerryDB solving it.
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "Any alternative solutions or features you've considered."
  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Add any other context, mockup screenshots, or examples."
