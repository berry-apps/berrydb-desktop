# Conformance test matrix.
# Usage:
#   docker compose -f Tests/docker/compose.yml up -d --wait
#   BERRYDB_TEST_POSTGRES=127.0.0.1:54329:berry:berrypass:berrydb_test \
#   BERRYDB_TEST_MYSQL=127.0.0.1:33069:root:berrypass:berrydb_test \
#   BERRYDB_TEST_QDRANT=127.0.0.1:63339 \
#   BERRYDB_TEST_DYNAMODB=127.0.0.1:48000 \
#   BERRYDB_TEST_MONGO=127.0.0.1:27117:berry:berrypass:berrydb_test \
#   BERRYDB_TEST_MONGO_RS=127.0.0.1:27127 \
#   BERRYDB_TEST_SQLSERVER=127.0.0.1:14339:sa:BerryDB_Test_2026!:master \
#   BERRYDB_TEST_ELASTICSEARCH=127.0.0.1:19200 \
#   swift test
services:
  # postgres16:
  #   image: postgres:16-alpine
  #   ports: ["54329:5432"]
  #   environment:
  #     POSTGRES_USER: berry
  #     POSTGRES_PASSWORD: berrypass
  #     POSTGRES_DB: berrydb_test
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U berry -d berrydb_test"]
  #     interval: 2s
  #     timeout: 3s
  #     retries: 20
  #   networks:
  #    - berry-test-net

  # mysql84:
  #   # MySQL 8.4 defaults to caching_sha2_password — this is the M1 auth spike
 # #.
  #   image: mysql:8.4
  #   ports: ["33069:3306"]
  #   environment:
  #     MYSQL_ROOT_PASSWORD: berrypass
  #     MYSQL_DATABASE: berrydb_test
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pberrypass"]
  #     interval: 2s
  #     timeout: 3s
  #     retries: 30
  #   networks:
  #    - berry-test-net

  mssql:
    # amd64-only image, runs under Rosetta emulation on Apple Silicon
    # (confirmed via `docker image inspect` — no arm64 build exists,
 # sqlcmd lives at /opt/mssql-tools18/bin
    # (newer "tools18" package, not the older /opt/mssql-tools) and defaults
    # to encrypted connections — the healthcheck needs `-C` to trust the
    # container's self-signed cert, otherwise it fails on a TLS trust error
    # rather than a real unreadiness signal.
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ["14339:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BerryDB_Test_2026!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      - berry-test-net

  qdrant:
    # No auth configured — good enough for a local conformance container;
 # BERRYDB_TEST_QDRANT carries no API key.
    image: qdrant/qdrant:v1.10.1
    ports: ["63339:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - berry-test-net

  elasticsearch:
    # Security disabled (no auth) — good enough for a local conformance
    # container, same call as `qdrant` above; BERRYDB_TEST_ELASTICSEARCH
 # carries no credentials.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    ports: ["19200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - berry-test-net

  # mongo:
  #   # MONGO_INITDB_ROOT_USERNAME/PASSWORD creates a root user in the `admin`
  #   # database (fixed by the image's entrypoint script, not configurable) —
  #   # BERRYDB_TEST_MONGO's database field is "admin" for exactly that reason:
  #   # `ConnectionConfig.database` doubles as both the SCRAM authSource and the
  #   # working database for find/collections when no separate authSource is specified.
  #   image: mongo:7
  #   ports: ["27117:27017"]
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: berry
  #     MONGO_INITDB_ROOT_PASSWORD: berrypass
  #   healthcheck:
  #     test:
  #       [
  #         "CMD",
  #         "mongosh",
  #         "--quiet",
  #         "--eval",
  #         "db.adminCommand('ping')",
  #         "-u",
  #         "berry",
  #         "-p",
  #         "berrypass",
  #         "--authenticationDatabase",
  #         "admin",
  #       ]
  #     interval: 2s
  #     timeout: 3s
  #     retries: 30
  #   networks:
  #     - berry-test-net

  # mongo-rs:
  #   # Single-node replica set ("replica set of one") — conformance target for
 # # the v1 multi-seed/primary-discovery code path.
  #   # A real 3-node topology was tried and dropped: `rs.initiate()`'s
  #   # `primary`/`me` fields report the container's *internal* Docker hostname
  #   # (verified directly against a throwaway container, e.g.
  #   # "11f6c51a7abc:27017"), which the host machine running `swift test`
  #   # cannot resolve — a driver reconnect-to-the-reported-primary step would
  #   # fail from outside the compose network no matter how the members are
  #   # configured, making a multi-node setup flaky/untestable from the host
  #   # without extra DNS plumbing. A single member sidesteps that: it is
  #   # always its own primary, so the driver never needs to reconnect
  #   # elsewhere here — this still exercises the real
  #   # isWritablePrimary/primary/setName `hello` fields against a real
  #   # `mongod`. The "connected seed isn't primary, reconnect to the host it
  #   # names" branch is covered instead by `MongoWireClientTests` (stub
  #   # transports — deterministic, no Docker networking involved).
  #   # No auth (same call as `qdrant` above): this container's only job is
  #   # primary discovery — SCRAM auth is already covered by the standalone
  #   # `mongo` service + unit tests, no need to re-cover it here.
  #   image: mongo:7
  #   command: ["--replSet", "berryrs", "--bind_ip_all"]
  #   ports: ["27127:27017"]
  #   healthcheck:
  #     # Lazily self-initiates on the first healthcheck attempt (`rs.status()`
  #     # throws until `rs.initiate()` has run) instead of a separate one-shot
  #     # "initializer" container/service, which `docker compose up --wait` has
  #     # no clean way to depend on (it exits 0 rather than staying "healthy").
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate() }' && mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'",
  #       ]
  #     interval: 2s
  #     timeout: 5s
  #     retries: 40
  #   networks:
  #     - berry-test-net

  # dynamodb-local:
  #   # Test double straight from AWS — accepts any non-empty SigV4 credentials,
 # # no real AWS account needed.
  #   image: amazon/dynamodb-local:3.3.0
  #   command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
  #   ports: ["48000:8000"]
  #   healthcheck:
  #     test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
  #     interval: 2s
  #     timeout: 3s
  #     retries: 20
  #   networks:
  #     - berry-test-net

  # sshd:
 # # Bastion for SSH-tunnel conformance tests. The mod enables
  #   # AllowTcpForwarding; the tunnel targets service DNS names (postgres16).
  #   image: lscr.io/linuxserver/openssh-server:latest
  #   ports: ["22229:2222"]
  #   environment:
  #     PASSWORD_ACCESS: "true"
  #     USER_NAME: berry
  #     USER_PASSWORD: berrypass
  #     DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
  #   networks:
  #     - berry-test-net

networks:
  berry-test-net:
    driver: bridge
